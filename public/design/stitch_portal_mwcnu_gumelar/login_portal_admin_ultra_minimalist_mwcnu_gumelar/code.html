<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login Portal Admin - MWCNU Gumelar</title>
<!-- Google Fonts: Plus Jakarta Sans & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS CDN with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
          },
          colors: {
            nu: {
              primary: '#064E3B',
              secondary: '#047857',
              light: '#ECFDF5',
              dark: '#022c22'
            },
            warm: {
              bg: '#FAFAF9'
            }
          }
        }
      }
    };
  </script>
<!-- Strict Custom CSS: Zero Shadow Rule -->
<style data-purpose="custom-rules">
    * {
      box-shadow: none !important;
    }
    body {
      background-color: #FAFAF9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#FAFAF9] text-slate-800 h-screen overflow-hidden selection:bg-emerald-100 selection:text-emerald-900">
<!-- BEGIN: MainSplitLayout -->
<div class="flex flex-col lg:flex-row h-screen w-full m-0 p-0 overflow-hidden bg-white">
<!-- BEGIN: Left Column (40%) -->
<div class="relative hidden lg:flex flex-col justify-between w-[40%] h-full border-r border-neutral-200 overflow-hidden bg-slate-900 p-10 z-0">
<!-- Background Image: Architecture -->
<img alt="Islamic Architectural Geometry" class="absolute inset-0 w-full h-full object-cover z-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCaBsELpKpVke10e3tN_tJDW-n-sypWIUj6AoaSDU0V-rbrEXnbuIqmnUo0u8uLB_GjUlT8Zfg2-XrVPFXPq0UkHf2pgBf703DVlMmEh-VeSZVQnXnjKLR2BVhP0yKmRuA7STKBPw8yVNMnE745CiPf8xz2pE5E_DAbC7xiDMgPc2g2vGVf2KNu5Ahy-6r-M5vandFxcOnyGIRWV6gBsLKI9t5i6xxnkgUNGFXkhWrXlk2k2nySAETo">
<!-- Dark Luxury Overlay -->
<div class="absolute inset-0 bg-black/60 bg-emerald-950/40 z-[1]"></div>
<!-- Top: Back Button -->
<div class="relative z-10">
<a class="inline-flex items-center gap-2 px-3.5 py-2 rounded-none bg-black/30 hover:bg-black/50 backdrop-blur-md border border-white/20 text-white text-xs font-medium tracking-wide transition-all group" href="#">
<svg class="w-3.5 h-3.5 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Kembali ke Portal Publik</span>
</a>
</div>
<!-- Center: Logo & Heading -->
<div class="relative z-10 my-auto text-center flex flex-col items-center max-w-sm mx-auto">
<div class="w-16 h-16 mb-6 flex items-center justify-center p-2 rounded-full border border-white/20 bg-white/10 backdrop-blur-sm">
<img alt="Logo MWCNU Gumelar" class="w-full h-full object-contain filter brightness-0 invert" src="https://lh3.googleusercontent.com/aida/AEtjO1V13KcRGtfmVVPLWPkuhzkqGLb9Ru1IopZaEj4KbFPNU2iY8tnOMR686IkQsBwgK8CYdbg00DG0v-oPm86W4jQT3QXtpYkhds39qy6S_GDNn_y5nMzSEYqTIlwaZFt7g6hPzqxM4SmLWHYVHGohzqXn0GiW6caRFdanjj-yVl_BRYDosCpB4cuQhfFoJ45skST1PFFeMNnOVac1v3y30hI6XF50aN1VGUm4QQF7ox-ycVxmsMQVvp6nO8o">
</div>
<h2 class="text-2xl font-bold text-white tracking-wider uppercase leading-tight font-sans">
        Sistem Informasi &amp; Manajemen Data
      </h2>
</div>
<!-- Bottom: Subtle Label -->
<div class="relative z-10">
<p class="text-xs text-white/60 tracking-widest uppercase font-medium">
        MWCNU Kecamatan Gumelar
      </p>
</div>
</div>
<!-- END: Left Column (40%) -->
<!-- BEGIN: Right Column (60%) -->
<div class="w-full lg:w-[60%] h-full bg-white flex flex-col justify-between items-center px-8 sm:px-16 md:px-20 lg:px-24 py-10 overflow-y-auto" data-purpose="auth-form-column">
<!-- Mobile Top Back Navigation -->
<div class="w-full flex justify-start lg:hidden mb-6">
<a class="inline-flex items-center gap-2 text-xs font-semibold text-neutral-600 hover:text-black transition-colors" href="#">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Kembali ke Portal</span>
</a>
</div>
<div class="hidden lg:block w-full h-4"></div>
<!-- Center Form Box (max-w-[400px]) -->
<div class="w-full max-w-[400px] my-auto py-6">
<!-- Header Form: Left-aligned -->
<div class="text-left mb-8">
<h1 class="text-3xl font-bold tracking-tight text-neutral-900">
          Masuk ke Portal.
        </h1>
<p class="text-sm text-neutral-500 mt-2">
          Masukkan kredensial administrator Anda.
        </p>
</div>
<!-- Form Login Flush Minimalist -->
<form class="w-full space-y-6" data-purpose="login-form" onsubmit="event.preventDefault();">
<!-- Field 1: ID Pengguna / NIK -->
<div class="space-y-1.5 text-left">
<label class="block text-[11px] font-semibold text-neutral-500 uppercase tracking-widest" for="identifier">
            ID Pengguna / NIK
          </label>
<input class="w-full py-2.5 px-0 text-sm bg-transparent border-0 border-b border-black text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:ring-0 focus:border-black rounded-none transition-colors" id="identifier" name="identifier" placeholder="330214xxxxxx atau username" required="" type="text">
</div>
<!-- Field 2: Kata Sandi -->
<div class="space-y-1.5 text-left">
<label class="block text-[11px] font-semibold text-neutral-500 uppercase tracking-widest" for="password">
            Kata Sandi
          </label>
<div class="relative flex items-center">
<input class="w-full py-2.5 pr-8 pl-0 text-sm bg-transparent border-0 border-b border-black text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:ring-0 focus:border-black rounded-none transition-colors" id="password" name="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-0 pr-0 flex items-center text-neutral-400 hover:text-black transition-colors" id="togglePassword" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Extra Options -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-3.5 h-3.5 rounded-none border-neutral-400 text-black focus:ring-0 cursor-pointer" id="rememberMe" type="checkbox">
<span class="text-xs text-neutral-600 font-normal select-none">Ingat Saya</span>
</label>
<a class="text-xs text-neutral-600 hover:text-black transition-colors" href="#">
            Lupa Kata Sandi?
          </a>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-black hover:bg-neutral-800 text-white font-medium py-3.5 px-6 rounded-none transition-colors flex items-center justify-center gap-2 text-sm border-0 tracking-wide" type="submit">
<span>Masuk ke Sistem</span>
</button>
</div>
</form>
</div>
<!-- Footer Kolom Kanan -->
<footer class="w-full py-4 text-center" data-purpose="footer-column">
<p class="text-xs text-neutral-400 font-normal">
        © 2026 Hak Cipta MWCNU Gumelar. Akses Terbatas.
      </p>
</footer>
</div>
<!-- END: Right Column (60%) -->
</div>
<!-- END: MainSplitLayout -->
<!-- BEGIN: Scripts -->
<script data-purpose="password-visibility-toggle">
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        togglePasswordBtn.classList.toggle('text-[#047857]', isPassword);
      });
    }
  </script>
<!-- END: Scripts -->
</body></html>
